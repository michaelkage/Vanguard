plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.vanguard.identity'
version = '1.0.0'

def registryServerPublicKey = providers.gradleProperty('vanguardRegistryServerPublicKey').getOrElse('')
if (registryServerPublicKey && !(registryServerPublicKey ==~ /[A-Za-z0-9_-]{59}/)) {
  throw new GradleException('vanguardRegistryServerPublicKey must be a 59-character unpadded base64url Ed25519 SPKI key')
}

android {
  namespace 'dev.vanguard.identity'
  buildFeatures {
    buildConfig true
  }
  sourceSets {
    main.java.srcDir('../../../protocol-core/src/main/kotlin')
  }
  defaultConfig {
    minSdkVersion 23
    consumerProguardFiles 'consumer-rules.pro'
    buildConfigField 'String', 'VANGUARD_REGISTRY_SERVER_PUBLIC_KEY', "\"\${registryServerPublicKey}\""
  }
}

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
}
