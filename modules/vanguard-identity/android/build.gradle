plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.vanguard.identity'
version = '1.0.0'

android {
  namespace 'dev.vanguard.identity'
  sourceSets {
    main.java.srcDir('../../../protocol-core/src/main/kotlin')
  }
  defaultConfig {
    minSdkVersion 23
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
}
