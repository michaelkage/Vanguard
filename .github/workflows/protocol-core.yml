name: Vanguard CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/expo-client-foundation"]

concurrency:
  group: vanguard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-manual:
    name: Field manual quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Validate product site and inline scripts
        run: node --test scripts/site.node.mjs

  kotlin-protocol:
    name: Kotlin protocol tests and Android storage build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run protocol tests
        run: gradle :protocol-core:test

      - name: Build Android runtime
        run: gradle :android-runtime:assembleDebug

  expo-android:
    name: Expo Android prebuild and native compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify local Expo module autolinking
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/vanguard-autolinking.json
          grep -q "VanguardIdentityModule" /tmp/vanguard-autolinking.json
          grep -q "VanguardNearbyModule" /tmp/vanguard-autolinking.json

      - name: Type-check application
        run: npm run typecheck

      - name: Run application tests
        run: npm test

      - name: Validate Expo SDK dependencies
        run: npm run doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Verify generated Kotlin compiler pin
        working-directory: android
        run: |
          grep -q '^android.kotlinVersion=2.4.20$' gradle.properties
          grep -q 'kotlin-gradle-plugin' build.gradle

      - name: Compile Android application and local native modules
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin
