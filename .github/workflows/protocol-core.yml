name: Vanguard CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: vanguard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-protocol:
    name: Kotlin protocol tests and Android storage build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run protocol tests
        run: gradle :protocol-core:test

      - name: Build Android runtime
        run: gradle :android-runtime:assembleDebug

  expo-client:
    name: Expo TypeScript checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Run application tests
        run: npm test

      - name: Validate Expo SDK dependencies
        run: npm run doctor
