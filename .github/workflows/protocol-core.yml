name: Vanguard CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: vanguard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-protocol:
    name: Kotlin protocol tests and Android storage build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run protocol tests
        run: gradle :protocol-core:test

      - name: Build Android runtime
        run: gradle :android-runtime:assembleDebug

  expo-android:
    name: Expo Android prebuild and native compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Run application tests
        run: npm test

      - name: Validate Expo SDK dependencies
        run: npm run doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Compile Android application and local native modules
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin
